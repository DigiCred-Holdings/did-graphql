name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Lets the job mint an OIDC token for npm trusted publishing. Without
  # this the publish falls back to looking for a registry token, finds
  # none, and fails with ENEEDAUTH.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1.
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@digicredholdingsinc'

      # Node 24 has shipped several npm 11.x versions, not all of them
      # >= 11.5.1. Pin the floor explicitly rather than inheriting
      # whatever the runner's Node image happens to bundle this month.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - run: npm ci

      - name: Create Release PR or publish to npm
        uses: changesets/action@v2
        with:
          # runs `npm run build` (client + server) then `changeset publish`.
          # Named `publish-script` since action v2 — as plain `publish` it
          # is silently ignored with only an "Unexpected input(s)" warning.
          publish-script: npm run release
          # v2 breaking change: the token must come through this input.
          # A `GITHUB_TOKEN` env var, credentials left behind by
          # actions/checkout, and tokens embedded in remote URLs are all
          # explicitly no longer substitutes. This still resolves to the
          # default token today, so the behaviour is unchanged — but when
          # this is swapped for a GitHub App installation token (to get
          # Version Packages PRs created automatically again, which org
          # policy currently forbids GITHUB_TOKEN from doing), it has to
          # be set here. Passing it as env would fail silently.
          github-token: ${{ secrets.GITHUB_TOKEN }}
        # No NODE_AUTH_TOKEN and no `env:` block at all: publishing
        # authenticates via OIDC against the trusted publisher configured
        # for each package on npmjs.com (org `digicredholdingsinc`, this
        # repo, this workflow file). Provenance attestations are generated
        # automatically on that path — the repo is public, which npm
        # requires for them.
