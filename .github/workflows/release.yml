name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  # `pull-requests: write` is deliberately absent. It never helped — org
  # policy blocks Actions from opening PRs regardless of job permissions —
  # and the Version Packages PR is now opened with the App installation
  # token instead, which carries its own.
  #
  # Lets the job mint an OIDC token for npm trusted publishing. Without
  # this the publish falls back to looking for a registry token, finds
  # none, and fails with ENEEDAUTH.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Mints an installation token for the `digicred-releases` GitHub App,
      # scoped to this repo and valid for an hour. GITHUB_TOKEN cannot open
      # the Version Packages PR — org policy forbids Actions from creating
      # pull requests, and the repo-level setting for it is locked — so
      # every release needed that PR opened by hand. App installation
      # tokens are not subject to that restriction.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1.
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@digicredholdingsinc'

      # Node 24 has shipped several npm 11.x versions, not all of them
      # >= 11.5.1. Pin the floor explicitly rather than inheriting
      # whatever the runner's Node image happens to bundle this month.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - run: npm ci

      - name: Create Release PR or publish to npm
        uses: changesets/action@v2
        with:
          # runs `npm run build` (client + server) then `changeset publish`.
          # Named `publish-script` since action v2 — as plain `publish` it
          # is silently ignored with only an "Unexpected input(s)" warning.
          publish-script: npm run release
          # Must be this input, not an env var: action v2 explicitly
          # stopped accepting `GITHUB_TOKEN` from the environment, from
          # actions/checkout's leftover credentials, or from a remote URL.
          # Set as env, a custom token like this one is ignored silently.
          github-token: ${{ steps.app-token.outputs.token }}
        # No NODE_AUTH_TOKEN and no `env:` block at all: publishing
        # authenticates via OIDC against the trusted publisher configured
        # for each package on npmjs.com (org `digicredholdingsinc`, this
        # repo, this workflow file). Provenance attestations are generated
        # automatically on that path — the repo is public, which npm
        # requires for them.
